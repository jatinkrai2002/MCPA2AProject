#create a Deployment, Service, and optional ConfigMap for environment variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-kpi-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-kpi-app
  template:
    metadata:
      labels:
        app: agentic-kpi-app
    spec:
      containers:
        - name: agentic-kpi-app
          image: agentic-kpi-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: agentic-kpi-config
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: assets-volume
              mountPath: /app/assets
      volumes:
        - name: data-volume
          emptyDir: {}
        - name: assets-volume
          emptyDir: {}
